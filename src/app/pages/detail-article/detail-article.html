@if (article) {
  <article class="detail-article">
    <div class="topbar">
      <a routerLink="/" class="retour">← Retour aux articles</a>
      <span class="badge">{{ article.categorie }}</span>
    </div>

    <h1>{{ article.titre }}</h1>

    <div class="auteur-row">
      <div class="avatar">{{ initiales }}</div>
      <div class="auteur-info">
        <p class="auteur-nom">{{ article.auteur }}</p>
        <p class="auteur-meta">{{ article.date }} · {{ tempsLecture }} min de lecture</p>
      </div>
    </div>

    <img [src]="article.image" [alt]="article.titre" class="hero-img" />

    <div class="corps">
      <p class="lead">{{ article.contenu }}</p>

      <blockquote class="citation">
        {{ article.extrait }}
      </blockquote>
    </div>
  </article>
} @else {
  <div class="introuvable">
    <h1>Article introuvable</h1>
    <a routerLink="/" class="retour">← Retour aux articles</a>
  </div>
}
